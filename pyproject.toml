[project]
name = "artseek"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "bs4>=0.0.2",
    "colpali-engine>=0.3.13",
    "datasets>=4.5.0",
    "ipykernel>=7.1.0",
    "isort>=7.0.0",
    "langchain>=1.2.8",
    "langchain-community>=0.4.1",
    "langchain-huggingface>=1.2.0",
    "neo4j>=6.1.0",
    "python-dotenv>=1.2.1",
    "qdrant-client>=1.16.2",
    "scikit-learn>=1.8.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57",
    "unidecode>=1.4.0",
    "w3lib>=2.4.0",
    "wikidata>=0.9.0",
]

# Torch-only index
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
